services:
  - type: web
    name: church-financial-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: church-financial-db
          property: connectionString
      - key: DEBUG
        value: "false"

databases:
  - name: church-financial-db
    databaseName: church_financial
    user: churchms
    plan: free
