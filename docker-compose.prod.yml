version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: church-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-churchms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-churchms_secret}
      POSTGRES_DB: ${POSTGRES_DB:-church_financial}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    # No external port exposure in production - only accessible within Docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-churchms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: church-backend-prod
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://churchms:churchms_secret@db:5432/church_financial}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DEBUG=False
      - CORS_ALLOW_ALL=True
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # React Frontend + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=/api/v1
    container_name: church-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/church-app/ssl-certs:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot:latest
    container_name: church-certbot
    volumes:
      - /opt/church-app/ssl-certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_prod_data:
    driver: local
  certbot_webroot:
    driver: local

networks:
  default:
    name: church-prod-network
