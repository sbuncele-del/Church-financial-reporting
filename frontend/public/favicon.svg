<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Church building -->
  <rect x="25" y="45" width="50" height="40" fill="url(#grad)" rx="2"/>
  <!-- Roof -->
  <polygon points="50,20 20,45 80,45" fill="url(#grad)"/>
  <!-- Cross -->
  <rect x="47" y="8" width="6" height="20" fill="#d4af37"/>
  <rect x="43" y="12" width="14" height="6" fill="#d4af37"/>
  <!-- Door -->
  <rect x="42" y="60" width="16" height="25" fill="#1e3a8a" rx="8" ry="8"/>
  <!-- Windows -->
  <circle cx="35" cy="60" r="5" fill="#fef3c7"/>
  <circle cx="65" cy="60" r="5" fill="#fef3c7"/>
</svg>
